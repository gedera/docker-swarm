name: Ruby

on:
  # Habilitado para correr los tests A MANO — ver el `if:` del paso.
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.4.4'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        if: github.event_name == 'workflow_dispatch'
      - name: Run unit tests
        run: bundle exec rspec --tag ~type:integration
      - name: Run linter
        run: bundle exec rubocop
